# One always-on machine in Dallas with a volume for run data. docs/deploy.md has the setup steps.
# If someone else already has this app name on Fly, pick another and change it here.
app = "rundown-spurs"
primary_region = "dfw"
kill_signal = "SIGTERM"
# Next.js finishes in-flight requests and pending after() work before it exits.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# Runs and cached Twelve Labs answers. The volume ties the app to one machine, which the engine needs:
# runs live in that machine's memory, so a second machine would not see them.
[[mounts]]
  source = "rundown_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # A run keeps working after its request returns, so the machine must not stop when traffic does.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

# ffmpeg needs headroom while it cuts a clip.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
