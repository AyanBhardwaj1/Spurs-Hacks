name: Code review

# Sets the required `Code review` status on a PR's head commit. It is green
# only when Codex has finished reviewing that commit and, unless the PR only changes Markdown, CodeRabbit has also reviewed it
# rather than skipping for its rate limit. Unresolved review threads block merging
# separately, through the branch ruleset.
#
# A "codex: waived" or "coderabbit: waived" label skips that bot.
#
# It writes a commit status instead of relying on this job's own check run,
# because comment and status events run against `main` and their check runs
# would never attach to the PR's head.

on:
  # pull_request_target so fork PRs also get a writable token. The job reads
  # PR metadata through the API and never checks out or runs PR code.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  status:

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

# One evaluation at a time across the repository. Each run reads the current
# state when it starts, so the last write always reflects the newest state; a
# per-PR group can't be used because status events only carry a commit SHA.
concurrency:
  group: code-review
  cancel-in-progress: false

jobs:
  gate:
    name: Evaluate code review
    if: >-
      (github.event_name != 'status' || github.event.context != 'Code review') &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const CODEX = "chatgpt-codex-connector[bot]";
            const CODERABBIT = "coderabbitai[bot]";
            const WAIVER = "coderabbit: waived";
            // For when Codex acknowledges a review request but never posts one. Adding the
            // label is a person's decision and shows in the PR's timeline.
            const CODEX_WAIVER = "codex: waived";
            // Only PRs that change nothing but Markdown can skip CodeRabbit.
            const docsOnly = (files) => files.every((f) => f.filename.endsWith(".md"));

            // Every run re-evaluates every open PR. Runs share one concurrency group, so a
            // queued run for one PR can be replaced by a later run for another; evaluating
            // all of them keeps the replaced PR's status current.
            async function prNumbers() {
              const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              return prs.map((pr) => pr.number);
            }

            function codexVerdict(comments, reviews, head, labels) {
              if (labels.includes(CODEX_WAIVER)) return { ok: true, text: "Codex waived" };
              const limited = comments.find((c) => c.user.login === CODEX && /usage limits for code reviews/i.test(c.body));
              const stateComment = comments.find((c) => c.user.login === CODEX && c.body.includes("codex-review-state:v1"));
              const match = stateComment && /codex-review-state:v1 (\{.*?\}) -->/.exec(stateComment.body);
              const review = match ? JSON.parse(match[1]).code_review : null;

              // Codex sets status "running", "completed" or "failed". A failed run can still
              // carry has_any_findings, so only "completed" counts as a review. Its
              // has_unresolved_findings flag stays true after the finding's thread is
              // resolved (seen on #9), so open findings are left to the ruleset's
              // resolved-threads rule.
              if (review?.commit_sha === head && review.status === "completed") {
                return { ok: true, text: "Codex reviewed this commit" };
              }
              if (review?.commit_sha === head && review.status === "failed") {
                return { ok: false, state: "pending", text: "Codex couldn't finish this review; comment \"@codex review\" to retry" };
              }
              if (limited && Date.parse(limited.updated_at) > Date.parse(stateComment?.updated_at ?? 0)) {
                return { ok: false, state: "failure", text: "Codex hit its review usage limit; this commit is unreviewed" };
              }
              if (review?.commit_sha === head) return { ok: false, state: "pending", text: "Codex is reviewing this commit" };
              return { ok: false, state: "pending", text: "Waiting for Codex; comment \"@codex review\" on the PR" };
            }

            // The combined status has one entry per context, 30 per page by default.
            async function statusesFor(ref) {
              return github.paginate(
                github.rest.repos.getCombinedStatusForRef,
                { owner, repo, ref, per_page: 100 },
                (response) => response.data.statuses,
              );
            }

            async function coderabbitVerdict(head, files, labels, reviews, statuses) {
              if (docsOnly(files)) return { ok: true, text: "" };
              if (labels.includes(WAIVER)) return { ok: true, text: "CodeRabbit waived" };
              // A reply on a review thread is also recorded as a review on the head, so
              // only a full review, which opens with its actionable-comment count, counts.
              const fullReview = (r) => r.user.login === CODERABBIT && r.commit_id === head && r.state !== "DISMISSED" && /Actionable comments posted/i.test(r.body ?? "");
              if (reviews.some(fullReview)) return { ok: true, text: "CodeRabbit reviewed" };
              const status = statuses.find((s) => s.context === "CodeRabbit");
              const dismissed = reviews.some((r) => r.user.login === CODERABBIT && r.commit_id === head && r.state === "DISMISSED");
              if (!dismissed && status?.state === "success" && /review completed/i.test(status.description ?? "")) {
                return { ok: true, text: "CodeRabbit reviewed" };
              }
              const why = status ? status.description : "no review yet";
              return { ok: false, state: "pending", text: `Waiting for CodeRabbit (${why}); comment "@coderabbitai review" once it can run` };
            }

            async function evaluate(number) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== "open") return;
              const head = pr.head.sha;
              const [comments, reviews, files] = await Promise.all([
                github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 }),
                github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 }),
                github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 }),
              ]);
              const labels = pr.labels.map((l) => l.name);

              const statuses = await statusesFor(head);
              const codex = codexVerdict(comments, reviews, head, labels);
              const rabbit = await coderabbitVerdict(head, files, labels, reviews, statuses);
              const blocking = [codex, rabbit].find((v) => !v.ok);
              const state = blocking ? blocking.state : "success";
              const description = (blocking ? blocking.text : [codex.text, rabbit.text].filter(Boolean).join("; ")).slice(0, 140);

              // GitHub keeps at most 1,000 statuses per commit and context, and every
              // run evaluates every open PR, so write only when the verdict changes.
              const current = statuses.find((s) => s.context === "Code review");
              if (current?.state === state && current.description === description) {
                core.info(`#${number} ${head.slice(0, 7)}: unchanged, ${state}`);
                return;
              }
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: head, state, context: "Code review", description, target_url: pr.html_url,
              });
              core.info(`#${number} ${head.slice(0, 7)}: ${state}, ${description}`);
            }

            // One PR's failure must not stop the others from being updated; report all at the end.
            const failures = [];
            for (const number of await prNumbers()) {
              try {
                await evaluate(number);
              } catch (error) {
                failures.push(`#${number}: ${error.message}`);
              }
            }
            if (failures.length) core.setFailed(`Could not evaluate ${failures.join("; ")}`);
